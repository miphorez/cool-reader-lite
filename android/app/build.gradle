apply plugin: 'com.android.application'

def resolveGitCommit = {
    String revision = System.getenv('GITHUB_SHA')
    if (revision)
        return revision.take(8)
    try {
        def process = new ProcessBuilder('git', 'rev-parse', '--short=8', 'HEAD')
                .directory(rootProject.projectDir.parentFile)
                .redirectErrorStream(true)
                .start()
        String output = process.inputStream.getText('UTF-8').trim()
        if (process.waitFor() == 0 && output) {
            def statusProcess = new ProcessBuilder('git', 'status', '--porcelain', '--untracked-files=no')
                    .directory(rootProject.projectDir.parentFile)
                    .redirectErrorStream(true)
                    .start()
            String status = statusProcess.inputStream.getText('UTF-8').trim()
            if (statusProcess.waitFor() == 0 && status)
                output += '-dirty'
            return output
        }
    } catch (Exception ignored) {
        // Source archives may not contain Git metadata.
    }
    return 'unknown'
}

def gitCommit = resolveGitCommit()

android {
    // Keep the source namespace while JNI entry points still use org.coolreader class names.
    namespace 'org.coolreader'
    compileSdkVersion 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId "io.github.miphorez.coolreaderlite"
        minSdkVersion 21
        targetSdkVersion 35
        // When new version released, version code must be incremented at least by 8
        // for compatibility with ABI versioning of split apk (see below).
        versionCode 32578
        versionName "0.2.0-preview.1"
        buildConfigField "String", "UPSTREAM_VERSION_NAME", '"3.2.59-1"'
        buildConfigField "String", "GIT_COMMIT", "\"${gitCommit}\""
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags ""
            }
        }
    }
    sourceSets {
        main {
            setRoot('src/main')
            java.srcDirs = ['../../android/src']
            res.srcDirs = ['../../android/res']
        }
    }
    buildTypes {
        release {
            // to make the bug report more readable.
            minifyEnabled false
            shrinkResources false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-optimize.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                }
            }
            packagingOptions{
                doNotStrip "**/*.so"
            }
        }
        release_stripped {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules-optimize.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            jniDebuggable true
            debuggable true
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
            packagingOptions{
                doNotStrip "**/*.so"
            }
        }
    }
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked"
        }
    }
    // https://developer.android.com/studio/build/configure-apk-splits
    splits {
        abi {
            enable true
            reset()
            include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a' //select ABIs to build APKs for
            universalApk true //generate an additional APK that contains all the ABIs
        }
    }
     // map for the version code
    project.ext.abiCodes = [
            'armeabi': 1,
            'armeabi-v7a': 2,
            'arm64-v8a': 6,
            'mips': 3,
            'mips64': 7,
            'x86': 4,
            'x86_64': 5
    ]
    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            // Stores the value of ext.abiCodes that is associated with the ABI for this variant.
            def baseAbiVersionCode = project.ext.abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI))
            if (baseAbiVersionCode != null) {
                // Variant 1: small version code increment for various ABI (old behaviour)
                output.versionCodeOverride = variant.versionCode + baseAbiVersionCode
                // Variant 2: big version code increment for various ABI
                //output.versionCodeOverride = variant.versionCode + 1000000*baseAbiVersionCode
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    lintOptions {
        disable 'MissingTranslation'
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    compileOptions {
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

task prepareKotlinBuildScriptModel {}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation project(path: ':genrescollection')
}
