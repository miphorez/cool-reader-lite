<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <filter id="icon-color" color-interpolation-filters="sRGB">
      <feFlood flood-color="white" result="color"/>
      <feComposite in="color" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
  <image width="24" height="24" href="data:image/png;base64," filter="url(#icon-color)"/>
</svg>
